<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="css/home.css">
  <link href="https://fonts.googleapis.com/css2?family=Winky+Sans:wght@300&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/singup.js" defer></script>
  <script src="js/auth.js" defer></script>
  <title>New Era</title>
</head>

<body>
  <header>
    <div class="logo">
      <img src="picture/logo.png" alt="Logo" width="100" />
    </div>
    <!--Links to other pages of the site-->
    <div class="navigation">
      <a href="Home.html">Home</a>
      <a href="AboutUs.html">About</a>
      <a href="Products.html">Shop</a>
      <a href="Cart.html">Cart</a>
      <a href="ContactUs.html">Contact</a>
      <a href="Login.html" id="login-link">Login</a>
    </div>
  </header>

  <div class="body-container">
    <h2>Register forms</h2>

    <form id="signup-form" class="signup-form" action="/singup" method="post" >

      <div class="input-box">
        <label>First Name:</label>
        <input id="first-name" type="text" name="firstName" placeholder="Enter your first name" required>
      </div>

      <div class="input-box">
        <label>Last Name:</label>
        <input id="last-name" type="text" name="lastName" placeholder="Enter your last name" required>
      </div>

      <div class="input-box">
        <label>Email:</label>
        <input id="email" type="email" name="Email" placeholder="Enter your email" required>
      </div>

      <div class="input-box">
        <label>Phone Number:</label>
        <input id="phone" type="tel" name="phoneNumber" placeholder="Enter your phone number (e.g., 0123456789)" required>
      </div>


      <div class="input-box">
        <label for="city">City:</label>
        <input id="city" type="text" id="city" name="city" placeholder="Enter your city" required>
      </div>

      <div class="input-box">
        <label>Password:</label>
        <input id="password" type="password" name="password" placeholder="Choose your password" required>
      </div>
      
      <div>
        <input id="show" type="checkbox"/>
        <label for="show">show password</label>
      </div>

      <div class="input-box">
        <label>Confirm Password:</label>
        <input id="confirm-password" type="password" name="confirmPassword" placeholder="Enter your password again" required>
      </div>

      <div>
        <input type="submit" value="Register">
      </div>
    </form>
  </div>
  
  <div class="terms-conditions">
    <a href="PrivacyPolicy.html" class="footer-link">Privacy Policy</a>
    <a href="TermsOfService.html" class="footer-link">Terms of Service</a>
  </div>
  <footer>&copy; Group 10 WEB course</footer>
</body>

</html>
