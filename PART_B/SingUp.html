<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="css/home.css">
  <link href="https://fonts.googleapis.com/css2?family=Winky+Sans:wght@300&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Era</title>
</head>

<body>
  <header>
    <div class="logo">
      <img src="picture/logo.png" alt="Logo" width="100" />
    </div>
    <!--Links to other pages of the site-->
    <div class="navigation">
      <a href="Home.html">Home</a>
      <a href="AboutUs.html">About</a>
      <a href="Products.html">Shop</a>
      <a href="ContactUs.html">Contact</a>
      <a href="Login.html" id="login-link">Login</a>
    </div>
  </header>

  <div class="body-container">
    <h2>Register forms</h2>

    <form action="Profil.html" method="GET" enctype="multipart/form-data">

      <div>
        <label>First Name:</label>
        <input type="text" name="firstName" placeholder="Enter your first name" required>
      </div>

      <div>
        <label>Last Name:</label>
        <input type="text" name="lastName" placeholder="Enter your last name" required>
      </div>

      <div>
        <label>Email:</label>
        <input type="email" name="Email" placeholder="Enter your email" required>
      </div>

      <div>
        <label>Phone Number:</label>
        <input type="tel" name="phoneNumber" placeholder="Enter your phone number (e.g., 0123456789)" required>
      </div>


      <div>
        <label for="city">City:</label>
        <input type="text" id="city" name="city" placeholder="Enter your city" required>
      </div>

      <div>
        <label>Password:</label>
        <input type="password" name="password" placeholder="Choose your password" required>
      </div>

      <div>
        <label>Confirm Password:</label>
        <input type="password" name="confirmPassword" placeholder="Enter your password again" required>
      </div>

      <div>
        <input type="submit" value="Register">
      </div>

      <a href="PrivacyPolicy.html">Privacy Policy</a> <a href="TermsOfService.html">Terms of Service</a>

    </form>
  </div>
  <footer>&copy; Group 10 WEB course</footer>
</body>

</html>
