<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="css/home.css">
  <link href="https://fonts.googleapis.com/css2?family=Winky+Sans:wght@300&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/products.js" defer></script>
  <script src="js/auth.js" defer></script>
  <title>New Era</title>
</head>

<body>
  <header>
    <div class="logo">
      <img src="picture/logo.png" alt="Logo" width="100" />
    </div>
    <!--Links to other pages of the site-->
    <div class="navigation">
      <a href="Home.html">Home</a>
      <a href="AboutUs.html">About</a>
      <a href="Products.html">Shop</a>
      <a href="Cart.html">Cart</a>
      <a href="ContactUs.html">Contact</a>
      <a href="Login.html" id="login-link">Login</a>
    </div>
  </header>

  <div class="body-container">
    <h2>Our Products</h2>

    <p>filter by:</p>

    <form>
      <label for="size">Size:</label>
      <select id="size" name="size">
        <option value="">All Sizes</option>
        <option value="0-3">0-3 Months</option>
        <option value="3-6">3-6 Months</option>
        <option value="6-12">6-12 Months</option>
      </select>

      <label for="color">Color:</label>
      <select id="color" name="color">
        <option value="">All Colors</option>
        <option value="blue">Blue</option>
        <option value="pink">Pink</option>
        <option value="green">Green</option>
      </select>

      <label for="gender">Gender:</label>
      <select id="gender" name="gender">
        <option value="">All</option>
        <option value="boys">Boys</option>
        <option value="girls">Girls</option>
      </select>

      <label for="type">Type:</label>
      <select id="type" name="type">
        <option value="">All Types</option>
        <option value="overalls">Overalls</option>
        <option value="shirts">Shirts</option>
        <option value="pants">Pants</option>
        <option value="skirts">Skirts</option>
        <option value="dresses">Dresses</option>
      </select>

      <label for="condition">Condition:</label>
      <select id="condition" name="condition">
        <option value="">All</option>
        <option value="first-hand">First Hand</option>
        <option value="second-hand">Second Hand</option>
      </select><br><br>
    </form>

    <p>מיקום בדפים</p>

    <div id="products"></div>
  </div>

  <div class="terms-conditions">
    <a href="PrivacyPolicy.html" class="footer-link">Privacy Policy</a>
    <a href="TermsOfService.html" class="footer-link">Terms of Service</a>
  </div>
  <footer>&copy; Group 10 WEB course</footer>
</body>

</html>
